[package]
name = "hotpath-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Demo benchmarks for the hotpath-cloud Claude connector."
license = "MIT"

[dependencies]
hotpath = "0.31"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cloud = ["hotpath", "hotpath/hotpath-cloud"]
hotpath-callgrind = ["hotpath", "hotpath/hotpath-callgrind"]

# Merged mode needs symbols in the release binary: never strip them.
[profile.release]
strip = false
