name: hotpath dedup

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark:
    name: benchmark (dedup)
    # Fork pull requests get no `id-token: write`, so there is nothing to upload.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Instruction counts depend on the Valgrind build, the Rust toolchain and
    # the OS, so the image, the package and the toolchain are pinned.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the upload authenticates with the job's OIDC token
    # Shared by both runs, so their reports describe one benchmark.
    env:
      HOTPATH_BENCHMARK: dedup
      HOTPATH_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      # Computed once, so both runs carry identical metadata. Commas would
      # split the metadata pairs, so they are stripped from the CPU name.
      - name: Record environment metadata
        id: meta
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1 | tr -d ',')
          rustc=$(rustc --version | cut -d' ' -f2)
          echo "value=runner=${RUNNER_OS}-${RUNNER_ARCH},cpu=${cpu},rustc=${rustc},toolchain=1.99.0,profile=release,valgrind=3.26.0" >> "$GITHUB_OUTPUT"
      - name: Build benchmark
        run: |
          cargo build -q --locked --release --example dedup \
            --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
      - name: Run benchmark natively
        env:
          HOTPATH_USER_METADATA: ${{ steps.meta.outputs.value }}
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/release/examples/dedup
      - name: Run benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_USER_METADATA: ${{ steps.meta.outputs.value }}
          HOTPATH_UPLOAD: fail-on-error
          HOTPATH_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload.json
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
            target/release/examples/dedup
          test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
            "$HOTPATH_OUTPUT_PATH" > /dev/null
